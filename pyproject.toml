[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eblock"
version = "0.1.0"
description = "数据驱动的咖啡店模拟经营游戏（学习项目）"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "note2060" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]
tetris = [
    "pygame-ce>=2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eblock"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
